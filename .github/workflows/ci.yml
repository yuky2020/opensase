name: CI

on:
  push:
  pull_request:

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run go vet
        run: go vet ./...

      - name: Run tests
        run: go test -race ./...

      - name: Run store tests on PostgreSQL (ADR-0033)
        env:
          OPENSASE_TEST_POSTGRES: postgres://postgres:test@localhost:5432/postgres?sslmode=disable
        run: go test -race ./pkg/store/... ./internal/controlplane/...

      - name: Run govulncheck
        uses: golang/govulncheck-action@v1

  fuzz:
    name: Fuzz
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run fuzz tests
        run: |
          go test -list '^Fuzz' ./...
          for pkg in $(go list ./...); do
            targets=$(go test -list '^Fuzz' "$pkg" | grep '^Fuzz' || true)
            for target in $targets; do
              echo "Fuzzing $target in $pkg"
              go test -run '^$' -fuzz "^${target}\$" -fuzztime 20s "$pkg"
            done
          done

      - name: Upload fuzz crashers
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-crashers
          path: '**/testdata/fuzz/**'

  windows:
    name: Windows
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run go vet
        shell: bash
        run: go vet ./cmd/opensase-client ./cmd/opensased ./mobile/... ./pkg/... ./internal/...

      - name: Build client and daemon
        shell: bash
        run: |
          go build ./cmd/opensase-client
          go build ./cmd/opensased

      - name: Run tests
        shell: bash
        run: go test ./cmd/opensase-client ./pkg/policy/... ./pkg/packet/... ./pkg/pqsession/... ./mobile/... ./internal/desktop/...

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build Windows desktop app
        shell: bash
        run: cd clients/mobile && flutter build windows --release

      - name: Upload Windows desktop app
        uses: actions/upload-artifact@v7
        with:
          name: desktop-windows
          path: clients/mobile/build/windows/x64/runner/Release/

      - name: Fetch Wintun
        shell: bash
        run: |
          curl -fsSLo wintun.zip https://www.wintun.net/builds/wintun-0.14.1.zip
          sha256sum wintun.zip
          echo "07c256185d6ee3652e09fa55c0b673e2624b565e02c4b9091c79ca7d2f24ef51  wintun.zip" | sha256sum -c -
          unzip -q wintun.zip

      - name: Build MSI
        shell: bash
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add --global WixToolset.Util.wixext/5.0.2
          go build -trimpath -ldflags "-s -w" -o dist/daemon/opensased.exe ./cmd/opensased
          go build -trimpath -ldflags "-s -w" -o dist/daemon/opensase-cli.exe ./cmd/opensase
          VERSION=$(grep '^version:' clients/mobile/pubspec.yaml | cut -d' ' -f2 | cut -d'+' -f1 | tr -d '\r')
          # WiX resolves relative harvest paths against the .wxs file: pass absolute ones.
          ROOT=$(cygpath -w "$PWD")
          wix build deploy/desktop/windows/opensase.wxs -wx -ext WixToolset.Util.wixext -arch x64 -d Version=$VERSION -d DaemonDir="$ROOT\dist\daemon" -d WintunDir="$ROOT\wintun\bin\amd64" -d AppDir="$ROOT\clients\mobile\build\windows\x64\runner\Release" -o dist/opensase-$VERSION-x64.msi

      - name: Upload OpenSASE MSI
        uses: actions/upload-artifact@v7
        with:
          name: opensase-msi
          path: dist/*.msi

  desktop-linux:
    name: Desktop (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev rpm

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Test and build Linux desktop app
        run: cd clients/mobile && flutter test && flutter build linux --release

      - name: Upload Linux desktop app
        uses: actions/upload-artifact@v7
        with:
          name: desktop-linux
          path: clients/mobile/build/linux/x64/release/bundle/

      - name: Build .deb
        run: |
          go build -trimpath -ldflags "-s -w" -o dist/opensased ./cmd/opensased
          go build -trimpath -ldflags "-s -w" -o dist/opensase-cli ./cmd/opensase
          VERSION=$(grep '^version:' clients/mobile/pubspec.yaml | cut -d' ' -f2 | cut -d'+' -f1 | tr -d '\r')
          sh scripts/package-deb.sh "$VERSION" dist/opensased clients/mobile/build/linux/x64/release/bundle dist dist/opensase-cli
          dpkg-deb --info dist/*.deb
          dpkg-deb --contents dist/*.deb

      - name: Upload Linux .deb package
        uses: actions/upload-artifact@v7
        with:
          name: opensase-deb
          path: dist/*.deb

      - name: Build .rpm
        run: |
          VERSION=$(grep '^version:' clients/mobile/pubspec.yaml | cut -d' ' -f2 | cut -d'+' -f1 | tr -d '\r')
          sh scripts/package-rpm.sh "$VERSION" dist/opensased clients/mobile/build/linux/x64/release/bundle dist dist/opensase-cli
          rpm -qpil dist/*.rpm

      - name: Upload Linux .rpm package
        uses: actions/upload-artifact@v7
        with:
          name: opensase-rpm
          path: dist/*.rpm

      - name: Build Arch package
        run: |
          VERSION=$(grep '^version:' clients/mobile/pubspec.yaml | cut -d' ' -f2 | cut -d'+' -f1 | tr -d '\r')
          docker run --rm -v "$PWD:/src" -w /src -e VERSION="$VERSION" archlinux:latest sh -c '
            set -eu
            pacman -Sy --noconfirm base-devel
            useradd -m builder
            cp -a /src /tmp/src
            chown -R builder:builder /tmp/src
            su builder -c "sh /tmp/src/scripts/package-arch.sh \"$VERSION\" /tmp/src/dist/opensased /tmp/src/clients/mobile/build/linux/x64/release/bundle /tmp/src/dist /tmp/src/dist/opensase-cli"
            cp /tmp/src/dist/*.pkg.tar.zst /src/dist/
            pacman -Qip /src/dist/*.pkg.tar.zst
          '

      - name: Upload Arch Linux package
        uses: actions/upload-artifact@v7
        with:
          name: opensase-arch
          path: dist/*.pkg.tar.zst

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

  android:
    name: Mobile (Flutter + Go core)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android NDK
        run: echo "y" | sdkmanager --install "ndk;28.2.13676358"

      - name: Install gomobile and gobind
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest

      - name: Initialize gomobile
        run: gomobile init

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter analyze and test
        run: make app-test

      - name: Build APK
        run: make apk
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358

      - name: Upload Debug APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: clients/mobile/build/app/outputs/flutter-apk/*.apk

  portal:
    name: Admin portal (Flutter web)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Analyze, test and build
        run: |
          make portal-test
          make portal

  images:
    name: Container images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build every dev stack image
        working-directory: deploy/dev
        # Compose needs the variable to parse the file; no stack is started here.
        env:
          OPENSASE_ADMIN_TOKEN: build-only
        run: docker compose --profile e2e --profile av build

  helm:
    name: Helm charts (kind)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Lint and render the charts
        run: |
          for c in deploy/helm/opensase-controlplane deploy/helm/opensase-edge; do
            helm lint "$c"
            helm template t "$c" >/dev/null
          done
          helm template t deploy/helm/opensase-controlplane --set database.type=postgres --set database.postgres.existingSecret=pg | grep -q 'type: RollingUpdate'
          ! helm template t deploy/helm/opensase-controlplane --set database.type=postgres 2>/dev/null

      - name: Create a kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: opensase

      - name: Build and load the images
        run: |
          mkdir -p clients/admin/build/web
          echo '<!doctype html><title>portal placeholder</title>' > clients/admin/build/web/index.html
          docker build -q -t opensase-controlplane:ci -f deploy/release/Dockerfile.controlplane .
          docker build -q -t opensase-edge:ci -f deploy/release/Dockerfile.edge .
          kind load docker-image opensase-controlplane:ci opensase-edge:ci --name opensase

      - name: PKI and Secrets
        run: |
          CP=cp-controlplane.opensase.svc
          EDGE=edge1-edge.opensase-edge.svc
          go run ./cmd/opensasectl pki init -dir pki -cp-san "$CP,localhost,127.0.0.1" -edge-san "$EDGE" \
            -session-url "https://$EDGE:8443" -wg-endpoint "$EDGE:51820" -broker-addr "$EDGE:8444"
          kubectl create namespace opensase
          kubectl label namespace opensase pod-security.kubernetes.io/enforce=restricted
          kubectl -n opensase create secret generic opensase-pki \
            --from-file=pki/root.crt --from-file=pki/root.key --from-file=pki/controlplane.crt \
            --from-file=pki/controlplane.key --from-file=pki/snapshot.key --from-file=pki/ca-kek.key \
            --from-file=pki/edges.json
          echo "TOKEN=$(head -c 24 /dev/urandom | od -An -tx1 | tr -d ' \n')" >> "$GITHUB_ENV"

      - name: Install the Control Plane
        run: |
          kubectl -n opensase create secret generic opensase-admin-token --from-literal=token="$TOKEN"
          helm install cp deploy/helm/opensase-controlplane -n opensase \
            --set image.repository=opensase-controlplane --set image.tag=ci --set image.pullPolicy=Never \
            --set controlURL=https://cp-controlplane.opensase.svc:9443 --set service.type=ClusterIP \
            --set categoriesURL= --set database.sqlite.size=200Mi
          kubectl -n opensase rollout status deploy/cp-controlplane --timeout=180s

      - name: Register the Edge and install it
        run: |
          kubectl -n opensase port-forward svc/cp-controlplane 9443:9443 >/dev/null 2>&1 &
          sleep 3
          OPENSASE_ADMIN_TOKEN="$TOKEN" go run ./cmd/opensasectl -url https://localhost:9443 -ca pki/root.crt edge add -id edge-1
          kubectl create namespace opensase-edge
          kubectl label namespace opensase-edge pod-security.kubernetes.io/enforce=privileged
          kubectl -n opensase-edge create secret generic opensase-edge-1-pki --from-file=pki/edge/
          helm install edge1 deploy/helm/opensase-edge -n opensase-edge \
            --set image.repository=opensase-edge --set image.tag=ci --set image.pullPolicy=Never \
            --set controlURL=https://cp-controlplane.opensase.svc:9443 \
            --set wgEndpoint=edge1-edge.opensase-edge.svc:51820 --set service.type=NodePort
          kubectl -n opensase-edge rollout status deploy/edge1-edge --timeout=180s

      - name: Dump state on failure
        if: failure()
        run: |
          kubectl get pods -A -o wide
          kubectl -n opensase logs deploy/cp-controlplane --tail=100 || true
          kubectl -n opensase-edge logs deploy/edge1-edge --all-containers --tail=100 || true
          kubectl -n opensase-edge describe pod -l app.kubernetes.io/name=opensase-edge | tail -40 || true
