name: opensase_admin
description: "OpenSASE admin portal (Flutter web)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.14.0

dependencies:
  fl_chart: ^1.3.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4
  http: ^1.6.0
  intl: ^0.20.3
  material_ui: ^1.11.1
  qr_flutter: ^4.1.0
  web: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true

  # Bundled so the web build never fetches Roboto from fonts.gstatic.com: the Control Plane
  # serves the portal with a same-origin-only CSP (font-src 'self'). Apache License 2.0.
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
