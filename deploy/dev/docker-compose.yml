name: opensase

services:
  controlplane:
    build:
      context: ../..
      dockerfile: deploy/dev/Dockerfile.controlplane
    image: opensase/controlplane:dev
    restart: unless-stopped
    user: "${OPENSASE_UID:-1000}:${OPENSASE_GID:-1000}"
    # Least privilege (ST-08): no capabilities, no privilege gain, read-only root filesystem.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    ports:
      - "9443:9443/tcp"
    networks:
      default:
        ipv4_address: 172.31.250.3
    environment:
      OPENSASE_ADMIN_TOKEN: ${OPENSASE_ADMIN_TOKEN:?run bootstrap.sh first}
    # Only what the Control Plane needs (security review #2): never pki/edge (Edge keys).
    # tenants/ is writable because tenant CAs are created on demand.
    volumes:
      - ./pki/root.crt:/pki/root.crt:ro
      - ./pki/root.key:/pki/root.key:ro
      - ./pki/controlplane.crt:/pki/controlplane.crt:ro
      - ./pki/controlplane.key:/pki/controlplane.key:ro
      - ./pki/snapshot.key:/pki/snapshot.key:ro
      - ./pki/edges.json:/pki/edges.json:ro
      - ./pki/tenants:/pki/tenants
      - ./data:/data
      # Admin portal (Flutter web). Build it first with `make portal`; served at /admin/.
      - ../../clients/admin/build/web:/portal:ro
    # Web categories (ADR-0022): the UT1 list (CC BY-SA 4.0) is downloaded into data/ on first
    # start (about 26 MB) and refreshed daily. CATEGORIES_URL= (empty) turns downloads off.
    command: ["-listen", ":9443", "-db", "/data/controlplane.db", "-pki", "/pki", "-control-url", "https://${CONTROL_HOST:-controlplane}:9443", "-portal-dir", "/portal", "-categories-file", "/data/categories.tar.gz", "-categories-url", "${CATEGORIES_URL-https://dsi.ut-capitole.fr/blacklists/download/blacklists.tar.gz}"]
    healthcheck:
      test: ["CMD", "/opensasectl", "-url", "https://localhost:9443", "-ca", "/pki/root.crt", "pq-check"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 2s

  edge:
    build:
      context: ../..
      dockerfile: deploy/dev/Dockerfile.edge
    image: opensase/edge:dev
    restart: unless-stopped
    ports:
      - "8443:8443/tcp"
      - "8444:8444/tcp" # Connector broker (ADR-0013)
      - "51820:51820/udp"
    networks:
      default:
        ipv4_address: 172.31.250.2
    # Least privilege (security review #2): the entrypoint installs iptables rules as root
    # with these capabilities only, then setpriv drops to EDGE_UID keeping NET_ADMIN (TUN,
    # addresses) and NET_BIND_SERVICE (DNS on :53) as ambient capabilities.
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - NET_BIND_SERVICE
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    devices:
      - "/dev/net/tun:/dev/net/tun"
    sysctls:
      net.ipv4.ip_forward: 1
      net.ipv6.conf.all.disable_ipv6: 0
    environment:
      EDGE_UID: ${OPENSASE_UID:-1000}
      EDGE_GID: ${OPENSASE_GID:-1000}
      EDGE_ALLOW_PRIVATE: ${EDGE_ALLOW_PRIVATE:-0}
      # TLS inspection listener (ADR-0018); empty disables. Tenants opt in with policy web.inspect.
      EDGE_INSPECT_PORT: ${EDGE_INSPECT_PORT-15002}
      # Malware scanning (ADR-0020): the clamav service (profile "av"). Unreachable = unscanned.
      EDGE_CLAMD: ${EDGE_CLAMD-clamav:3310}
      # OCR for DLP on images (ADR-0024): the ocr service (profile "av"). Unreachable = unscanned.
      EDGE_OCR: ${EDGE_OCR-http://ocr:8090}
    # Only the Edge directory: root.crt, edge.crt, edge.key, edge-wg.key.
    volumes:
      - ./pki/edge:/pki:ro
      # Private Edge state cache and local flow log (ADR-0014), owned by EDGE_UID.
      - ./edge-state:/var/lib/opensase-edge
    depends_on:
      controlplane:
        condition: service_healthy
    command: ["-control-url", "https://controlplane:9443", "-pki", "/pki", "-listen", ":8443", "-wg-port", "51820", "-wg-endpoint", "${EDGE_HOST:-edge}:51820", "-upstream-dns", "${UPSTREAM_DNS:-1.1.1.1:53}", "-ztna-listen", "0.0.0.0:15001", "-broker-listen", ":8444", "-state-dir", "/var/lib/opensase-edge", "-flow-log", "/var/lib/opensase-edge/flows.jsonl"]

  # Malware scanner for the Edge (ADR-0020). Heavy (about 1 GiB of RAM for the signatures),
  # so it only runs with the "av" profile: docker compose --profile av up -d clamav.
  clamav:
    profiles: ["av"]
    image: clamav/clamav:1.4
    restart: unless-stopped
    environment:
      CLAMAV_NO_MILTERD: "true"
    healthcheck:
      test: ["CMD-SHELL", "clamdcheck.sh"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 60s

  # OCR service for the Edge's DLP (ADR-0024): Tesseract behind a small HTTP API. It parses
  # untrusted images, so it runs locked down: read-only, no capabilities, unprivileged,
  # bounded memory and processes, reachable only on the internal network.
  ocr:
    profiles: ["av"]
    build:
      context: ../..
      dockerfile: deploy/dev/Dockerfile.ocr
    image: opensase/ocr:dev
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    pids_limit: 64
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8090/healthz"]
      interval: 15s
      timeout: 5s
      retries: 10

  # Connector (ADR-0013): outbound only, on the default network (Control Plane, Edge) and
  # on corp, the "data-centre LAN" that the Edge and the Control Plane cannot reach.
  connector:
    build:
      context: ../..
      dockerfile: deploy/dev/Dockerfile.connector
    image: opensase/connector:dev
    restart: unless-stopped
    # Same unprivileged host user as the Control Plane: it owns connector.key (0600) and the
    # 0700 state directory (connector key and certificate, 0600).
    user: "${OPENSASE_UID:-1000}:${OPENSASE_GID:-1000}"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    networks:
      - default
      - corp
    # The provisioning key is a mounted 0600 file (single use; ignored once enrolled).
    secrets:
      - connector_key
    volumes:
      - ./connector-state:/var/lib/opensase-connector
    depends_on:
      controlplane:
        condition: service_healthy
      edge:
        condition: service_started
    command: ["-control", "https://controlplane:9443#sha256=${OPENSASE_ROOT_SHA256:-}", "-key-file", "/run/secrets/connector_key", "-state", "/var/lib/opensase-connector"]

  # A private app reachable only from corp, under the name the PrivateApp publishes.
  intranet:
    image: busybox:1.37
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    networks:
      corp:
        aliases:
          - intranet.acme.internal
    command: ["sh", "-c", "mkdir -p /tmp/www && echo 'hello from intranet' >/tmp/www/index.html && exec httpd -f -p 80 -h /tmp/www"]

  ctl:
    profiles: ["tools"]
    image: opensase/controlplane:dev
    user: "${OPENSASE_UID:-1000}:${OPENSASE_GID:-1000}"
    entrypoint: ["/opensasectl"]
    environment:
      OPENSASE_URL: https://controlplane:9443
      OPENSASE_CA: /pki/root.crt
      OPENSASE_ADMIN_TOKEN: ${OPENSASE_ADMIN_TOKEN:-}
    volumes:
      - ./pki:/pki
      - ./:/work:ro

  client:
    profiles: ["e2e"]
    build:
      context: ../..
      dockerfile: deploy/dev/Dockerfile.client
    image: opensase/client:dev
    cap_add:
      - NET_ADMIN
    devices:
      - "/dev/net/tun:/dev/net/tun"
    sysctls:
      net.ipv6.conf.all.disable_ipv6: 0
    volumes:
      - ./pki/root.crt:/etc/opensase/root.crt:ro
      - clientstate:/var/lib/opensase-client
    # The provisioning key is read from a mounted 0600 file, never from the command line or
    # the environment, both visible in ps / docker inspect (security review #13).
    secrets:
      - provisioning_key
    depends_on:
      edge:
        condition: service_started
    command: ["-state", "/var/lib/opensase-client", "-control", "https://controlplane:9443", "-ca", "/etc/opensase/root.crt", "-key-file", "/run/secrets/provisioning_key", "-enroll", "-renew-now", "-routes", "-name", "e2e-client", "-status-every", "5s"]

  # Workload Gateway (ADR-0015): the Linux client in gateway mode, routing the vpc subnet into
  # the PQ tunnel. vpc is internal: its only way out is through the gateway.
  gateway:
    profiles: ["e2e"]
    image: opensase/client:dev
    cap_add:
      - NET_ADMIN
    devices:
      - "/dev/net/tun:/dev/net/tun"
    sysctls:
      net.ipv4.ip_forward: 1
      net.ipv6.conf.all.disable_ipv6: 0
    volumes:
      - ./pki/root.crt:/etc/opensase/root.crt:ro
      - gatewaystate:/var/lib/opensase-client
    secrets:
      - provisioning_key
    networks:
      default: {}
      vpc:
        ipv4_address: 10.30.0.2
    depends_on:
      edge:
        condition: service_started
    command: ["-state", "/var/lib/opensase-client", "-control", "https://controlplane:9443", "-ca", "/etc/opensase/root.crt", "-key-file", "/run/secrets/provisioning_key", "-enroll", "-gateway", "10.30.0.0/24", "-name", "e2e-gateway", "-status-every", "30s"]

  # A workload with no Client: its default route is the gateway (set by e2e.sh).
  workload:
    profiles: ["e2e"]
    image: opensase/client:dev
    cap_add:
      - NET_ADMIN
    networks:
      vpc:
        ipv4_address: 10.30.0.10
    entrypoint: ["sleep", "infinity"]

secrets:
  provisioning_key:
    file: ./provisioning.key # written by bootstrap.sh (mode 0600)
  connector_key:
    file: ./connector.key # written by bootstrap.sh (mode 0600)

networks:
  # Fixed addresses for the Control Plane and the Edge (issue #29): a recreated container keeps
  # its address, as a real server would, so a connected client's cached addresses and bypass
  # routes stay valid. Other containers get addresses from the upper half.
  default:
    ipam:
      config:
        - subnet: 172.31.250.0/24
          ip_range: 172.31.250.128/25
  # The customer LAN: no route to the internet, and neither the Edge nor the Control Plane
  # is attached. Only the Connector bridges it, outbound.
  corp:
    internal: true
  # A workload subnet (ADR-0015) with no route to anything but the Workload Gateway.
  vpc:
    internal: true
    ipam:
      config:
        - subnet: 10.30.0.0/24

volumes:
  clientstate: {}
  gatewaystate: {}
