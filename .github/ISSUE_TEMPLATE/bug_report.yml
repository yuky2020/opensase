name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      options: [Android client, Control Plane, Edge, Connector, Admin portal, opensasectl, Dev stack, Docs]
    validations: {required: true}
  - type: input
    id: version
    attributes: {label: Version or commit}
    validations: {required: true}
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: Do not paste keys, tokens or provisioning keys. Security issues go to SECURITY.md.
    validations: {required: true}
  - type: textarea
    id: repro
    attributes: {label: Steps to reproduce}
  - type: textarea
    id: logs
    attributes: {label: Logs, render: text}
