name: Feature request
description: Propose a new capability or a change
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes: {label: Problem to solve}
    validations: {required: true}
  - type: textarea
    id: proposal
    attributes: {label: Proposed solution}
  - type: textarea
    id: alternatives
    attributes: {label: Alternatives considered}
