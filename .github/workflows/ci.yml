name: CI

on:
  push:
  pull_request:

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run go vet
        run: go vet ./...

      - name: Run tests
        run: go test -race ./...

      - name: Run govulncheck
        uses: golang/govulncheck-action@v1

  windows:
    name: Windows
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run go vet
        shell: bash
        run: go vet ./cmd/opensase-client ./cmd/opensased ./mobile/... ./pkg/... ./internal/...

      - name: Build client and daemon
        shell: bash
        run: |
          go build ./cmd/opensase-client
          go build ./cmd/opensased

      - name: Run tests
        shell: bash
        run: go test ./cmd/opensase-client ./pkg/policy/... ./pkg/packet/... ./pkg/pqsession/... ./mobile/... ./internal/desktop/...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

  android:
    name: Mobile (Flutter + Go core)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android NDK
        run: echo "y" | sdkmanager --install "ndk;28.2.13676358"

      - name: Install gomobile and gobind
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest

      - name: Initialize gomobile
        run: gomobile init

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter analyze and test
        run: make app-test

      - name: Build APK
        run: make apk
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358

      - name: Upload Debug APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: clients/mobile/build/app/outputs/flutter-apk/*.apk

  portal:
    name: Admin portal (Flutter web)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Analyze, test and build
        run: |
          make portal-test
          make portal

  images:
    name: Container images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build every dev stack image
        working-directory: deploy/dev
        # Compose needs the variable to parse the file; no stack is started here.
        env:
          OPENSASE_ADMIN_TOKEN: build-only
        run: docker compose --profile e2e --profile av build
