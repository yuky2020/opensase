# Docker Compose override adding a second Edge service (edge2) for failover testing (issue #70).
services:
  edge2:
    image: opensase/edge:dev # built by the edge service
    restart: unless-stopped
    ports:
      - "8445:8443/tcp"
      - "8446:8444/tcp" # Connector broker (ADR-0013)
      - "51821:51820/udp"
    networks:
      default:
        ipv4_address: 172.31.250.4
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - NET_BIND_SERVICE
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    devices:
      - "/dev/net/tun:/dev/net/tun"
    sysctls:
      net.ipv4.ip_forward: 1
      net.ipv6.conf.all.disable_ipv6: 0
    environment:
      EDGE_UID: ${OPENSASE_UID:-1000}
      EDGE_GID: ${OPENSASE_GID:-1000}
      EDGE_ALLOW_PRIVATE: ${EDGE_ALLOW_PRIVATE:-0}
      EDGE_INSPECT_PORT: ${EDGE_INSPECT_PORT-15002}
      EDGE_CLAMD: ${EDGE_CLAMD-clamav:3310}
      EDGE_OCR: ${EDGE_OCR-http://ocr:8090}
    volumes:
      - ./pki/edge2:/pki:ro
      - ./edge2-state:/var/lib/opensase-edge
    depends_on:
      controlplane:
        condition: service_healthy
    command: ["-control-url", "https://controlplane:9443", "-pki", "/pki", "-listen", ":8443", "-wg-port", "51820", "-wg-endpoint", "${EDGE2_HOST:-edge2}:51820", "-upstream-dns", "${UPSTREAM_DNS:-1.1.1.1:53}", "-ztna-listen", "0.0.0.0:15001", "-broker-listen", ":8444", "-state-dir", "/var/lib/opensase-edge", "-flow-log", "/var/lib/opensase-edge/flows.jsonl"]

  client:
    depends_on:
      edge:
        condition: service_started
      edge2:
        condition: service_started
    extra_hosts:
      - "edge2:172.31.250.4"
    command: ["-state", "/var/lib/opensase-client", "-control", "https://controlplane:9443", "-ca", "/etc/opensase/root.crt", "-key-file", "/run/secrets/provisioning_key", "-enroll", "-renew-now", "-routes", "-name", "e2e-client", "-status-every", "1s"]
